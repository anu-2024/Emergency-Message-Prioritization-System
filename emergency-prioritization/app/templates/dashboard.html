<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ app_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">{{ app_name }}</span>
    <div class="d-flex align-items-center gap-3">
        <span class="badge bg-warning text-dark">Human-in-the-loop &mdash; no autonomous dispatch</span>
        <span id="userLabel" class="text-light small"></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container-fluid mt-3">
    <div class="row mb-3" id="statsRow"></div>

    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm mb-3">
                <div class="card-header">Submit New Message</div>
                <div class="card-body">
                    <textarea id="newMessageText" class="form-control mb-2" rows="3"
                              placeholder="Type an emergency message to analyze..."></textarea>
                    <button class="btn btn-primary btn-sm" onclick="submitMessage()">Analyze &amp; Add to Queue</button>
                    <div id="submitResult" class="mt-2 small"></div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header">Filters</div>
                <div class="card-body">
                    <label class="form-label small">Urgency</label>
                    <select id="filterUrgency" class="form-select form-select-sm mb-2" onchange="loadQueue()">
                        <option value="">All</option>
                        <option>Critical</option><option>High</option><option>Medium</option><option>Low</option>
                    </select>
                    <label class="form-label small">Category</label>
                    <select id="filterCategory" class="form-select form-select-sm mb-2" onchange="loadQueue()">
                        <option value="">All</option>
                        <option>Medical</option><option>Flood/Rescue</option><option>Fire</option>
                        <option>Food</option><option>Water</option><option>Shelter</option>
                        <option>Infrastructure</option><option>Other/Irrelevant</option>
                    </select>
                    <label class="form-label small">Priority source</label>
                    <select id="filterSource" class="form-select form-select-sm" onchange="loadQueue()">
                        <option value="">All</option>
                        <option value="rl">RL</option>
                        <option value="rule_based">Rule-based</option>
                        <option value="human_override">Human override</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Priority Queue</span>
                    <button class="btn btn-sm btn-outline-secondary" onclick="loadQueue()">Refresh</button>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0" id="queueTable">
                        <thead>
                        <tr>
                            <th>Priority</th><th>Urgency</th><th>Category</th>
                            <th>Message</th><th>Dup?</th><th>Source</th><th>Actions</th>
                        </tr>
                        </thead>
                        <tbody id="queueBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Message detail / override modal -->
<div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Message Detail</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="detailBody"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/dashboard.js"></script>
</body>
</html>
