<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login — {{ app_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
    <div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
        <div class="card shadow-sm login-card">
            <div class="card-body p-4">
                <h4 class="mb-1">{{ app_name }}</h4>
                <p class="text-muted small mb-4">Human-in-the-loop decision support &mdash; sign in to continue</p>
                <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign in</button>
                </form>
                <p class="text-muted small mt-3 mb-0">
                    Demo accounts (change before real deployment):<br>
                    <code>admin / Admin@123</code> &middot; <code>responder1 / Responder@123</code>
                </p>
            </div>
        </div>
    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errBox = document.getElementById('loginError');
        errBox.classList.add('d-none');
        const body = new URLSearchParams();
        body.append('username', document.getElementById('username').value);
        body.append('password', document.getElementById('password').value);
        try {
            const resp = await fetch('/api/auth/login', { method: 'POST', body });
            if (!resp.ok) {
                const err = await resp.json();
                errBox.textContent = err.detail || 'Login failed';
                errBox.classList.remove('d-none');
                return;
            }
            const data = await resp.json();
            localStorage_set(data.access_token, data.role);
            window.location.href = '/';
        } catch (err) {
            errBox.textContent = 'Could not reach the server. Is the backend running?';
            errBox.classList.remove('d-none');
        }
    });

    // NOTE: browser localStorage is used here (a real browser, not a
    // Claude Artifact sandbox) purely to hold the JWT for subsequent
    // fetch() calls from this same page -- standard practice for a
    // FastAPI + vanilla-JS dashboard.
    function localStorage_set(token, role) {
        window.localStorage.setItem('access_token', token);
        window.localStorage.setItem('role', role);
    }
    </script>
</body>
</html>
